<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" width="920" height="560" role="img" aria-label="LiveStop station bottom sheet and offline staleness mode">
  <defs>
    <style>
      .font { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .tabular { font-variant-numeric: tabular-nums; }
      .strike { text-decoration: line-through; }
    </style>
    <filter id="shadow-card" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.16"/>
    </filter>
    <filter id="shadow-phone" x="-8%" y="-6%" width="116%" height="116%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000000" flood-opacity="0.22"/>
    </filter>
    <clipPath id="screen-left">
      <rect x="60" y="42" width="360" height="476" rx="34"/>
    </clipPath>
    <clipPath id="screen-right">
      <rect x="500" y="42" width="360" height="476" rx="34"/>
    </clipPath>
  </defs>

  <rect width="920" height="560" rx="18" fill="#F3F4F6"/>

  <!-- ==================== LEFT PHONE: STATION SHEET (S+U WEDDING) ==================== -->
  <g filter="url(#shadow-phone)">
    <rect x="52" y="34" width="376" height="492" rx="42" fill="#1F2937"/>
    <rect x="55" y="37" width="370" height="486" rx="39" fill="#374151"/>
  </g>

  <g clip-path="url(#screen-left)" class="font">
    <!-- Map background peeking above the bottom sheet -->
    <rect x="60" y="42" width="360" height="160" fill="#EBE9E2"/>
    <path d="M 110 42 L 180 200" stroke="#FFFFFF" stroke-width="12" fill="none"/>
    <path d="M 60 120 L 420 95" stroke="#FFFFFF" stroke-width="10" fill="none"/>
    <rect x="195" y="50" width="90" height="22" rx="11" fill="#111827"/>
    <text x="84" y="65" font-size="11" font-weight="700" fill="#111827">09:41</text>

    <!-- Bottom Sheet Surface -->
    <g filter="url(#shadow-card)">
      <rect x="60" y="138" width="360" height="380" rx="22" fill="#FFFFFF"/>
    </g>
    <!-- Sheet Drag Handle -->
    <rect x="220" y="147" width="40" height="4" rx="2" fill="#D1D5DB"/>

    <!-- Station Header -->
    <text x="80" y="178" font-size="19" font-weight="700" fill="#111827">S+U Wedding</text>

    <!-- Section 1: S-BAHNSTEIG GLEIS 1 -->
    <text x="80" y="202" font-size="11" font-weight="600" fill="#6B7280" letter-spacing="0.4">S-BAHNSTEIG GLEIS 1</text>
    <rect x="80" y="212" width="36" height="20" rx="4" fill="#AD5937"/>
    <text x="98" y="226" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">S41</text>
    <text x="126" y="226" font-size="14" fill="#111827"><tspan font-size="17" font-weight="700">⟳</tspan> Ringbahn S 41</text>
    <text x="284" y="226" text-anchor="end" font-size="13" font-weight="700" fill="#15803D" class="tabular">2 min</text>
    <text x="348" y="226" text-anchor="end" font-size="13" font-weight="600" fill="#B91C1C" class="tabular">7 min +2</text>
    <text x="400" y="226" text-anchor="end" font-size="13" fill="#4B5563" class="tabular">12 min</text>

    <!-- Section 2: S-BAHNSTEIG GLEIS 2 -->
    <text x="80" y="254" font-size="11" font-weight="600" fill="#6B7280" letter-spacing="0.4">S-BAHNSTEIG GLEIS 2</text>
    <rect x="80" y="264" width="36" height="20" rx="4" fill="#CB6418"/>
    <text x="98" y="278" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">S42</text>
    <text x="126" y="278" font-size="14" fill="#111827"><tspan font-size="17" font-weight="700">⟲</tspan> Ringbahn S 42</text>
    <text x="284" y="278" text-anchor="end" font-size="13" font-weight="700" fill="#15803D" class="tabular">4 min</text>
    <text x="344" y="278" text-anchor="end" font-size="13" fill="#15803D" class="tabular">9 min</text>
    <text x="400" y="278" text-anchor="end" font-size="13" fill="#4B5563" class="tabular">14 min</text>

    <!-- Section 3: MÜLLERSTR. HT. LINDOWER STR. -->
    <text x="80" y="306" font-size="11" font-weight="600" fill="#6B7280" letter-spacing="0.4">MÜLLERSTRASSE HT. LINDOWER STRASSE</text>
    <!-- M27 with cancelled first trip -->
    <rect x="80" y="316" width="36" height="20" rx="4" fill="#A5027D"/>
    <text x="98" y="330" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">M27</text>
    <text x="126" y="330" font-size="14" fill="#111827">S Jungfernheide</text>
    <text x="292" y="330" text-anchor="end" font-size="13" font-weight="700" fill="#B91C1C" class="tabular strike">3 min</text>
    <text x="346" y="330" text-anchor="end" font-size="13" fill="#15803D" class="tabular">6 min</text>
    <text x="400" y="330" text-anchor="end" font-size="13" fill="#4B5563" class="tabular">13 min</text>

    <!-- Section 4: NO DEPARTURES SOON (Idle / Night lines) -->
    <text x="80" y="366" font-size="11" font-weight="600" fill="#6B7280" letter-spacing="0.4">NO DEPARTURES SOON</text>
    <g opacity="0.55">
      <rect x="80" y="376" width="36" height="20" rx="4" fill="#A5027D"/>
      <text x="98" y="390" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">N20</text>
      <text x="126" y="390" font-size="14" fill="#111827">S Oranienburger Str.</text>

      <rect x="80" y="404" width="36" height="20" rx="4" fill="#E30613"/>
      <text x="98" y="418" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">RE2</text>
      <text x="126" y="418" font-size="14" fill="#111827">Nauen</text>
      <text x="400" y="418" text-anchor="end" font-size="12" fill="#4B5563">Pl. 5</text>
    </g>

    <!-- Legend & Attribution -->
    <text x="80" y="456" font-size="11" fill="#6B7280">Green: live, on time. Red: live and late (+2 = 2 min).</text>
    <text x="80" y="472" font-size="11" fill="#6B7280">Black: timetable only.</text>
    <text x="80" y="498" font-size="10" fill="#4B5563">Data: VBB (CC BY 4.0)</text>
  </g>
  <text x="240" y="546" text-anchor="middle" class="font" font-size="13" font-weight="600" fill="#374151">Station Sheet · All Platforms &amp; Cancelled Trips</text>

  <!-- ==================== RIGHT PHONE: OFFLINE & STALE RESILIENCE ==================== -->
  <g filter="url(#shadow-phone)">
    <rect x="492" y="34" width="376" height="492" rx="42" fill="#1F2937"/>
    <rect x="495" y="37" width="370" height="486" rx="39" fill="#374151"/>
  </g>

  <g clip-path="url(#screen-right)" class="font">
    <rect x="500" y="42" width="360" height="476" fill="#EBE9E2"/>
    <polygon points="500,42 615,42 585,155 500,135" fill="#D9EAD3"/>
    <path d="M 550 42 L 725 518" stroke="#FFFFFF" stroke-width="14" fill="none"/>
    <path d="M 500 220 L 860 175" stroke="#FFFFFF" stroke-width="11" fill="none"/>
    <path d="M 500 320 L 860 265" stroke="#F9FAFB" stroke-width="7" fill="none"/>

    <!-- Top Status Bar + Dynamic Island -->
    <rect x="635" y="50" width="90" height="22" rx="11" fill="#111827"/>
    <text x="524" y="65" font-size="11" font-weight="700" fill="#111827">09:47</text>

    <!-- Warning Status Banner (> 5 min offline: amber warning surface + Try again) -->
    <g filter="url(#shadow-card)">
      <rect x="514" y="80" width="332" height="50" rx="12" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1"/>
      <text x="526" y="99" font-size="11.5" font-weight="700" fill="#78350F">No connection — showing last known data</text>
      <text x="526" y="117" font-size="10.5" fill="#78350F">updated 6 min ago, live times may be out of date</text>
      <rect x="774" y="91" width="62" height="28" rx="8" fill="#111827"/>
      <text x="805" y="109" text-anchor="middle" font-size="11" font-weight="600" fill="#FFFFFF">Try again</text>
    </g>

    <!-- Marker with dimmed (grey) stale live times & black timetable times -->
    <g filter="url(#shadow-card)">
      <rect x="548" y="166" width="220" height="110" rx="8" fill="#FFFFFF"/>
      <polygon points="652,276 664,276 658,284" fill="#FFFFFF"/>
      <text x="556" y="181" font-size="11" font-weight="700" fill="#111827">S+U Wedding</text>
      <!-- S41: live time dimmed to grey (#6B7280) because data > 5 min old -->
      <rect x="556" y="188" width="30" height="16" rx="4" fill="#AD5937"/>
      <text x="571" y="200" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">S41</text>
      <text x="592" y="200" font-size="12" fill="#111827"><tspan font-size="15" font-weight="700">⟳</tspan> Ringbahn S 41</text>
      <text x="760" y="200" text-anchor="end" font-size="12" font-weight="600" fill="#6B7280" class="tabular">1 min</text>
      <!-- S42: late live time dimmed to grey with delay kept -->
      <rect x="556" y="209" width="30" height="16" rx="4" fill="#CB6418"/>
      <text x="571" y="221" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">S42</text>
      <text x="592" y="221" font-size="12" fill="#111827"><tspan font-size="15" font-weight="700">⟲</tspan> Ringbahn S 42</text>
      <text x="760" y="221" text-anchor="end" font-size="12" font-weight="600" fill="#6B7280" class="tabular">3 min +2</text>
      <!-- U6: live time dimmed to grey -->
      <rect x="556" y="230" width="30" height="16" rx="4" fill="#8C6DAB"/>
      <text x="571" y="242" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">U6</text>
      <text x="592" y="242" font-size="12" fill="#111827">U Alt-Mariendorf</text>
      <text x="760" y="242" text-anchor="end" font-size="12" font-weight="600" fill="#6B7280" class="tabular">4 min</text>
      <!-- M27: scheduled timetable time stays black (#111827) -->
      <rect x="556" y="251" width="30" height="16" rx="4" fill="#A5027D"/>
      <text x="571" y="263" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">M27</text>
      <text x="592" y="263" font-size="12" fill="#111827">S Jungfernheide</text>
      <text x="760" y="263" text-anchor="end" font-size="12" font-weight="600" fill="#111827" class="tabular">7 min</text>
    </g>

    <!-- Bottom Empty/Info Card Callout showing on-device resilience -->
    <g filter="url(#shadow-card)">
      <rect x="524" y="388" width="312" height="82" rx="14" fill="#FFFFFF" fill-opacity="0.94"/>
      <text x="540" y="412" font-size="13" font-weight="700" fill="#111827">Offline countdowns keep running</text>
      <text x="540" y="432" font-size="11.5" fill="#4B5563">Departures that have left are dropped locally;</text>
      <text x="540" y="450" font-size="11.5" fill="#4B5563">stale live times dim to grey after 5 minutes.</text>
    </g>

    <!-- Bottom Right Attribution -->
    <rect x="732" y="492" width="120" height="18" rx="4" fill="#FFFFFF" fill-opacity="0.82"/>
    <text x="792" y="504" text-anchor="middle" font-size="10" fill="#4B5563">Data: VBB (CC BY 4.0)</text>
  </g>
  <text x="680" y="546" text-anchor="middle" class="font" font-size="13" font-weight="600" fill="#374151">Offline Mode · Stale Warning &amp; Dimmed Live Times</text>
</svg>
