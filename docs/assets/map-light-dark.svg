<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" width="920" height="560" role="img" aria-label="LiveStop map view in light mode and dark 3D mode">
  <defs>
    <style>
      .font { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .tabular { font-variant-numeric: tabular-nums; }
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.72; }
      }
      .live-pulse { animation: pulse 2.4s ease-in-out infinite; }
    </style>
    <filter id="shadow-light" x="-12%" y="-12%" width="124%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
    <filter id="shadow-phone" x="-8%" y="-6%" width="116%" height="116%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000000" flood-opacity="0.22"/>
    </filter>
    <clipPath id="screen-left">
      <rect x="60" y="42" width="360" height="476" rx="34"/>
    </clipPath>
    <clipPath id="screen-right">
      <rect x="500" y="42" width="360" height="476" rx="34"/>
    </clipPath>
  </defs>

  <!-- Background canvas -->
  <rect width="920" height="560" rx="18" fill="#F3F4F6"/>

  <!-- ==================== LEFT PHONE: LIGHT MODE (S+U WEDDING) ==================== -->
  <g filter="url(#shadow-phone)">
    <rect x="52" y="34" width="376" height="492" rx="42" fill="#1F2937"/>
    <rect x="55" y="37" width="370" height="486" rx="39" fill="#374151"/>
  </g>

  <g clip-path="url(#screen-left)" class="font">
    <!-- Light Map Base -->
    <rect x="60" y="42" width="360" height="476" fill="#EBE9E2"/>
    <!-- Parks & water -->
    <polygon points="60,42 175,42 145,155 60,135" fill="#D9EAD3"/>
    <polygon points="315,340 420,310 420,518 290,518" fill="#D9EAD3"/>
    <path d="M 60 410 Q 190 385 420 445" stroke="#B7D7E8" stroke-width="14" fill="none"/>

    <!-- Street Grid (Wedding: Müllerstraße / Ringbahn / Fennstraße) -->
    <path d="M 110 42 L 285 518" stroke="#FFFFFF" stroke-width="14" fill="none"/>
    <path d="M 60 220 L 420 175" stroke="#FFFFFF" stroke-width="11" fill="none"/>
    <path d="M 60 320 L 420 265" stroke="#F9FAFB" stroke-width="7" fill="none"/>
    <path d="M 185 42 L 155 518" stroke="#F9FAFB" stroke-width="7" fill="none"/>
    <path d="M 335 42 L 300 518" stroke="#F9FAFB" stroke-width="7" fill="none"/>
    <!-- S-Bahn Ringbahn tracks -->
    <path d="M 60 190 Q 230 220 420 150" stroke="#9CA3AF" stroke-width="3" stroke-dasharray="6,4" fill="none"/>

    <!-- 3D Building footprints (subtle in 2D) -->
    <rect x="82" y="236" width="54" height="36" rx="3" fill="#E0DDD5" stroke="#D3CFC6" stroke-width="1"/>
    <rect x="242" y="88" width="68" height="42" rx="3" fill="#E0DDD5" stroke="#D3CFC6" stroke-width="1"/>
    <rect x="295" y="285" width="64" height="44" rx="3" fill="#E0DDD5" stroke="#D3CFC6" stroke-width="1"/>

    <!-- User location blue dot -->
    <circle cx="222" cy="245" r="22" fill="#2563EB" fill-opacity="0.14"/>
    <circle cx="222" cy="245" r="7" fill="#FFFFFF"/>
    <circle cx="222" cy="245" r="5" fill="#2563EB"/>

    <!-- Top Status Bar + Dynamic Island -->
    <rect x="195" y="50" width="90" height="22" rx="11" fill="#111827"/>
    <text x="84" y="65" font-size="11" font-weight="700" fill="#111827">09:41</text>

    <!-- 3D Pitch Toggle Button (2D state) -->
    <g filter="url(#shadow-light)">
      <rect x="74" y="88" width="40" height="28" rx="8" fill="#FFFFFF"/>
      <text x="94" y="106" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">3D</text>
    </g>

    <!-- MARKER 1: S+U Wedding (Main Hub Cluster) -->
