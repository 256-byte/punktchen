      <rect x="216" y="400" width="30" height="16" rx="4" fill="#A5027D"/>
      <text x="231" y="412" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">M27</text>
      <text x="252" y="412" font-size="12" fill="#111827">S+U Pankow</text>
      <text x="396" y="412" text-anchor="end" font-size="12" font-weight="600" fill="#15803D" class="tabular">5 min</text>
      <text x="216" y="431" font-size="10" fill="#4B5563">+2 more</text>
