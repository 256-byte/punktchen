      <!-- Row 1: S41 Ringbahn -->
      <rect x="116" y="132" width="30" height="16" rx="4" fill="#AD5937"/>
      <text x="131" y="144" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">S41</text>
      <text x="152" y="144" font-size="12" fill="#111827"><tspan font-size="15" font-weight="700">⟳</tspan> Ringbahn S 41</text>
      <text x="320" y="144" text-anchor="end" font-size="12" font-weight="600" fill="#15803D" class="tabular live-pulse">2 min</text>
      <!-- Row 2: S42 Ringbahn -->
      <rect x="116" y="153" width="30" height="16" rx="4" fill="#CB6418"/>
      <text x="131" y="165" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">S42</text>
      <text x="152" y="165" font-size="12" fill="#111827"><tspan font-size="15" font-weight="700">⟲</tspan> Ringbahn S 42</text>
      <text x="320" y="165" text-anchor="end" font-size="12" font-weight="600" fill="#B91C1C" class="tabular">4 min +2</text>
      <!-- Row 3: U6 -->
      <rect x="116" y="174" width="30" height="16" rx="4" fill="#8C6DAB"/>
      <text x="131" y="186" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">U6</text>
      <text x="152" y="186" font-size="12" fill="#111827">U Alt-Mariendorf</text>
      <text x="320" y="186" text-anchor="end" font-size="12" font-weight="600" fill="#15803D" class="tabular live-pulse">now</text>
      <!-- Row 4: M27 -->
      <rect x="116" y="195" width="30" height="16" rx="4" fill="#A5027D"/>
      <text x="131" y="207" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">M27</text>
      <text x="152" y="207" font-size="12" fill="#111827">S Jungfernheide</text>
      <text x="320" y="207" text-anchor="end" font-size="12" font-weight="600" fill="#111827" class="tabular">6 min</text>
