      <!-- Row 2: 147 -->
      <rect x="82" y="329" width="30" height="16" rx="4" fill="#A5027D"/>
      <text x="97" y="341" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">147</text>
      <text x="118" y="341" font-size="12" fill="#111827">S Ostbahnhof</text>
      <text x="260" y="341" text-anchor="end" font-size="12" font-weight="600" fill="#111827" class="tabular">9 min</text>
    </g>

    <!-- MARKER 3: Nettelbeckplatz -->
    <g filter="url(#shadow-light)">
      <rect x="208" y="378" width="196" height="62" rx="8" fill="#FFFFFF"/>
      <polygon points="300,440 312,440 306,448" fill="#FFFFFF"/>
