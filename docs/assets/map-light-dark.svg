    <text x="352" y="504" text-anchor="middle" font-size="10" fill="#4B5563">Data: VBB (CC BY 4.0)</text>
  </g>
  <text x="240" y="546" text-anchor="middle" class="font" font-size="13" font-weight="600" fill="#374151">Light Mode · Live &amp; Ringbahn (⟳/⟲) Markers</text>

  <!-- ==================== RIGHT PHONE: DARK MODE + 3D BUILDINGS ==================== -->
  <g filter="url(#shadow-phone)">
    <rect x="492" y="34" width="376" height="492" rx="42" fill="#111827"/>
    <rect x="495" y="37" width="370" height="486" rx="39" fill="#1F2937"/>
  </g>

  <g clip-path="url(#screen-right)" class="font">
