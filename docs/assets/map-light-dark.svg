    <text x="524" y="65" font-size="11" font-weight="700" fill="#F3F4F6">09:41</text>

    <!-- Status Banner (Updated 2 min ago) -->
    <rect x="595" y="80" width="170" height="26" rx="10" fill="#16181D" fill-opacity="0.92" stroke="#2A2E37" stroke-width="1"/>
    <text x="680" y="97" text-anchor="middle" font-size="11" font-weight="600" fill="#F3F4F6">Updated 2 min ago</text>

    <!-- 3D Pitch Toggle Button (Active state, highlighted blue) -->
    <rect x="514" y="116" width="40" height="28" rx="8" fill="#2563EB"/>
    <text x="534" y="134" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">3D</text>

    <!-- DARK MARKER 1: S+U Alexanderplatz (+2 nearby stops) -->
    <g filter="url(#shadow-light)">
      <rect x="556" y="132" width="226" height="122" rx="8" fill="#1C1F26" stroke="#2A2E37" stroke-width="1"/>
      <polygon points="663,254 675,254 669,262" fill="#1C1F26"/>
      <text x="564" y="147" font-size="11" font-weight="700" fill="#F3F4F6">S+U Alexanderplatz</text>
      <text x="774" y="147" text-anchor="end" font-size="11" font-weight="600" fill="#9CA3AF">+2</text>
      <!-- Row 1: RE1 -->
      <rect x="564" y="154" width="32" height="16" rx="4" fill="#E30613"/>
      <text x="580" y="166" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">RE1</text>
      <text x="602" y="166" font-size="12" fill="#F3F4F6">Frankfurt (Oder)</text>
      <text x="774" y="166" text-anchor="end" font-size="12" font-weight="600" fill="#4ADE80" class="tabular live-pulse">1 min</text>
      <!-- Row 2: S5 -->
      <rect x="564" y="175" width="32" height="16" rx="4" fill="#EB7405"/>
      <text x="580" y="187" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">S5</text>
      <text x="602" y="187" font-size="12" fill="#F3F4F6">S Westkreuz</text>
      <text x="774" y="187" text-anchor="end" font-size="12" font-weight="600" fill="#4ADE80" class="tabular live-pulse">3 min</text>
      <!-- Row 3: U2 -->
      <rect x="564" y="196" width="32" height="16" rx="4" fill="#DA421E"/>
      <text x="580" y="208" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">U2</text>
      <text x="602" y="208" font-size="12" fill="#F3F4F6">S+U Pankow</text>
      <text x="774" y="208" text-anchor="end" font-size="12" font-weight="600" fill="#F87171" class="tabular">5 min +1</text>
      <!-- Row 4: M4 -->
      <rect x="564" y="217" width="32" height="16" rx="4" fill="#CE1B22"/>
      <text x="580" y="229" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">M4</text>
      <text x="602" y="229" font-size="12" fill="#F3F4F6">Falkenberg</text>
      <text x="774" y="229" text-anchor="end" font-size="12" font-weight="600" fill="#4ADE80" class="tabular">2 min</text>
      <text x="564" y="246" font-size="10" fill="#9CA3AF">+14 more</text>
    </g>

    <!-- DARK MARKER 2: Compact Badge Pill (Overview / Neighbour Cluster) -->
    <g filter="url(#shadow-light)">
      <rect x="615" y="346" width="184" height="48" rx="8" fill="#1C1F26" stroke="#2A2E37" stroke-width="1"/>
      <polygon points="701,394 713,394 707,402" fill="#1C1F26"/>
      <text x="623" y="361" font-size="11" font-weight="700" fill="#F3F4F6">U Weinmeisterstr.</text>
      <rect x="623" y="368" width="28" height="16" rx="4" fill="#224F86"/>
      <text x="637" y="380" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">U8</text>
      <rect x="655" y="368" width="28" height="16" rx="4" fill="#F3791D"/>
      <text x="669" y="380" text-anchor="middle" font-size="10" font-weight="700" fill="#000000">M1</text>
      <rect x="687" y="368" width="28" height="16" rx="4" fill="#659530"/>
      <text x="701" y="380" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">M8</text>
      <rect x="719" y="368" width="32" height="16" rx="4" fill="#A5027D"/>
      <text x="735" y="380" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">N40</text>
