    <!-- MARKER 2: Reinickendorfer Str. (Bus Pole) -->
    <g filter="url(#shadow-light)">
      <rect x="74" y="286" width="194" height="68" rx="8" fill="#FFFFFF"/>
      <polygon points="165,354 177,354 171,362" fill="#FFFFFF"/>
