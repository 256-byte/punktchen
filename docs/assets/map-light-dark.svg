    <!-- Building 1 -->
    <polygon points="525,220 595,225 595,260 525,255" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <polygon points="525,190 595,195 595,225 525,220" fill="#263449" stroke="#334155" stroke-width="1"/>
    <polygon points="595,195 612,182 612,247 595,260" fill="#172033" stroke="#334155" stroke-width="1"/>
    <!-- Building 2 (Alexanderplatz high-rise style) -->
