    <path d="M 720 42 L 820 518" stroke="#1E293B" stroke-width="16" fill="none"/>
    <path d="M 500 185 L 860 215" stroke="#1E293B" stroke-width="12" fill="none"/>
    <path d="M 500 315 L 860 355" stroke="#1E293B" stroke-width="14" fill="none"/>
    <path d="M 500 140 Q 680 165 860 125" stroke="#475569" stroke-width="3" stroke-dasharray="6,4" fill="none"/>

