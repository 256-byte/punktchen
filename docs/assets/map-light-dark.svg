    <polygon points="735,175 815,182 815,242 735,235" fill="#29384E" stroke="#3B4F6B" stroke-width="1"/>
    <polygon points="815,182 835,168 835,280 815,295" fill="#172033" stroke="#334155" stroke-width="1"/>
    <!-- Building 3 -->
    <polygon points="545,365 625,372 625,420 545,413" fill="#263449" stroke="#334155" stroke-width="1"/>
    <polygon points="545,340 625,347 625,372 545,365" fill="#334155" stroke="#475569" stroke-width="1"/>

    <!-- Top Status Bar + Dynamic Island -->
